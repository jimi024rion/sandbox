# lefthook.yml
post-merge:
  files: git diff --name-only HEAD^1 HEAD
  jobs:
    - name: install aqua packages if aqua.yaml changed
      root: "backend/"
      glob:
        - "backend/aqua.yaml"
      run: |
        echo "実行されたぜえええ"
        # マージによってaqua.yamlが変更されたかを確認
        # HEAD^1 はマージ前のコミットを指します
        # HEAD はマージ後の現在のコミットを指します
        if git diff --name-only HEAD^1 HEAD | grep -q aqua.yaml; then
          echo "aqua.yaml has changed. Running aqua i -l..."
          aqua i -l
        fi
# 修正

post-checkout:
  # LEFTHOOK_OLDPREV と LEFTHOOK_NEWPREV を使って変更ファイルをリストアップ
  # ただし、filesオプションは実行環境変数に依存しないため、直接git diffを実行する
  # files: git diff --name-only ${LEFTHOOK_OLDPREV} ${LEFTHOOK_NEWPREV}
  jobs:
    - name: check_env_vars
      run: |
        echo "--- Lefthook Environment Variables (post-checkout) ---"
        echo "LEFTHOOK_OLDPREV: ${LEFTHOOK_OLDPREV}"
        echo "LEFTHOOK_NEWPREV: ${LEFTHOOK_NEWPREV}"
        echo "LEFTHOOK_IS_BRANCH_CHECKOUT: ${LEFTHOOK_IS_BRANCH_CHECKOUT}"
        echo "----------------------------------------------------"

        # あなたの既存のロジックをここに続ける
        if [ "${LEFTHOOK_IS_BRANCH_CHECKOUT}" -eq 1 ]; then
          echo "post-checkoutが実行されたぜえええ"
          # ... aqua i -l などの処理 ...
        else
          echo "ブランチのチェックアウトではないため、post-checkout処理をスキップします。"
        fi
    - name: install aqua packages after checkout if aqua.yaml changed
      root: "backend/"
      glob:
        - "backend/aqua.yaml"
      run: |
        # LEFTHOOK_IS_BRANCH_CHECKOUT が "1" (ブランチチェックアウト) の場合のみ実行
        # ファイルチェックアウトや特定のコミットへの一時的な切り替えは対象外
        if [ "${LEFTHOOK_IS_BRANCH_CHECKOUT}" -eq 1 ]; then
          echo "post-checkoutが実行されたぜえええ"
          # Lefthookのglobとfilesオプションが既にaqua.yamlの変更を検出しているが、
          # より確実性を期すため、ここでは追加のチェックは行わない（globに任せる）
          # もし、glob以外で複雑な条件を加えたい場合は、ここに記述する

          echo "aqua.yaml has changed after checkout. Running aqua i -l..."
          aqua i -l
        else
          echo "ブランチのチェックアウトではないため、post-checkout処理をスキップします。"
        fi

pre-commit:
  jobs:
    - name: swagfmt
      root: "backend/"
      glob: "*{cmd/server/main.go,internal/presentation/http/**/*.go}"
      run: |
        if git diff --cached --unified=0 | grep -qE '^[+-].*//[[:space:]]*@'; then
          echo "Swagger comment changes detected. Running swagfmt..."
          make swagfmt
        else
          echo "No Swagger comment changes detected. Skipping swagfmt."
        fi
    - name: gofmt
      root: "backend/"
      glob: "*{.go}"
      files: git diff --name-only --cached -- "*.go"
      run: go fmt ./...
      stage_fixed: true

