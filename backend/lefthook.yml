# lefthook.yml
post-merge:
  files: git diff --name-only HEAD^1 HEAD
  jobs:
    - name: install aqua packages if aqua.yaml changed
      root: "backend/"
      glob:
        - "backend/aqua.yaml"
      run: |
        echo "実行されたぜえええ"
        # マージによってaqua.yamlが変更されたかを確認
        # HEAD^1 はマージ前のコミットを指します
        # HEAD はマージ後の現在のコミットを指します
        if git diff --name-only HEAD^1 HEAD | grep -q aqua.yaml; then
          echo "aqua.yaml has changed. Running aqua i -l..."
          aqua i -l
        fi
post-checkout:
  jobs:
    - name: install aqua packages if aqua.yaml changed
      root: "backend/"
      run: |
        # Gitフックから渡される引数をチェック
        # {1}: prev_ref, {2}: new_ref, {3}: is_branch_checkout

        echo "1kaime"
        echo "{1}" "{2}" "{3}"
        echo "2kaime"
        echo "$1 $2 $3"


        if [ "{3}" != "1" ]; then
          echo "Not a branch checkout, skipping."
          exit 0
        fi

        # チェックアウト前後で変更されたファイルを取得
        CHANGED_FILES=$(git diff --name-only "{1}" "{2}")

        if [ -z "$CHANGED_FILES" ]; then
          echo "No files changed."
          exit 0
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # backend/aqua.yaml に変更があったか確認
        if echo "$CHANGED_FILES" | grep -q "backend/aqua.yaml"; then
          echo "aqua.yaml has changed. Running 'aqua i -l'..."
          aqua i -l
        else
          echo "aqua.yaml has not changed."
        fi

pre-commit:
  jobs:
    - name: swagfmt
      root: "backend/"
      glob: "*{cmd/server/main.go,internal/presentation/http/**/*.go}"
      run: |
        if git diff --cached --unified=0 | grep -qE '^[+-].*//[[:space:]]*@'; then
          echo "Swagger comment changes detected. Running swagfmt..."
          make swagfmt
        else
          echo "No Swagger comment changes detected. Skipping swagfmt."
        fi
    - name: gofmt
      root: "backend/"
      glob: "*{.go}"
      files: git diff --name-only --cached -- "*.go"
      run: go fmt ./...
      stage_fixed: true

