# lefthook.yml
post-checkout:
  jobs:
    - name: check aqua.yaml changes
      # Lefthook はフック引数を環境変数として渡します:
      # LEFTHOOK_OLDPREV と LEFTHOOK_NEWPREV
      run: |
        echo $(git diff --name-only ${LEFTHOOK_OLDPREV} ${LEFTHOOK_NEWPREV})
        if git diff --name-only ${LEFTHOOK_OLDPREV} ${LEFTHOOK_NEWPREV} | grep -q aqua.yaml; then
          echo "hello aqua"
        fi


pre-commit:
  jobs:
    - name: swagfmt
      root: "backend/"
      glob: "*{cmd/server/main.go,internal/presentation/http/**/*.go}"
      run: |
        if git diff --cached --unified=0 | grep -qE '^[+-].*//[[:space:]]*@'; then
          echo "Swagger comment changes detected. Running swagfmt..."
          make swagfmt
        else
          echo "No Swagger comment changes detected. Skipping swagfmt."
        fi
    - name: gofmt
      root: "backend/"
      glob: "*{.go}"
      files: git diff --name-only --cached -- "*.go"
      run: go fmt ./...
      stage_fixed: true

